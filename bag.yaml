name: temporal
description: Temporal workflow orchestration — lifecycle, schedules, task queues, cloud management

instructions: |
  Use temporal MCP tools for workflow lifecycle operations (start, signal, query,
  cancel, terminate), schedule management, and workflow inspection.
  Use temporal_* CLI tools for task queue inspection, namespace administration,
  dev server management, cluster health, and Temporal Cloud operations.

mcp-servers:
  # Connects to localhost:7233 by default (temporal server start-dev).
  # For Temporal Cloud, set TEMPORAL_HOST, TEMPORAL_NAMESPACE, and
  # TEMPORAL_API_KEY in the profile env or machine env. The MCP server
  # is a separate Python process — it does NOT read the temporal CLI's
  # env profiles (`temporal env`). The CLI tools (temporalctl namespace)
  # use `--env` flags and are unaffected.
  temporal:
    command: uvx
    args: ["temporal-mcp-server"]


# Native in-process tools namespace as 'temporalctl' in code (src/tools.ts).
# Declared so namespace derivations (auto-traits, doctor, MCP boot checks)
# know this bag provides the namespace.
tool-metadata:
  - { toolName: temporal_status, namespace: temporalctl, access: read }
  - { toolName: temporal_server_start_dev, namespace: temporalctl, access: readwrite }
  - { toolName: temporal_server_status, namespace: temporalctl, access: read }
  - { toolName: temporal_task_queue_describe, namespace: temporalctl, access: read }
  - { toolName: temporal_namespace_list, namespace: temporalctl, access: read }
  - { toolName: temporal_namespace_describe, namespace: temporalctl, access: read }
  - { toolName: temporal_cluster_health, namespace: temporalctl, access: read }
  - { toolName: temporal_cluster_describe, namespace: temporalctl, access: read }
  - { toolName: temporal_workflow_count, namespace: temporalctl, access: read }
  - { toolName: temporal_env_list, namespace: temporalctl, access: read }
  - { toolName: temporal_cloud_whoami, namespace: temporalctl, access: read }
  - { toolName: temporal_cloud_namespace_list, namespace: temporalctl, access: read }
  - { toolName: temporal_cloud_namespace_get, namespace: temporalctl, access: read }
  - { toolName: temporal_cloud_account, namespace: temporalctl, access: read }

tools:
  entry: tools.ts

# Temporal ships its own OAuth via the CLI — `barry bag auth temporal`
# delegates to it. Credentials are cached by the temporal CLI; nothing
# lands in the vault or profile env.
auth:
  command: temporal
  args: [cloud, login]
  check:
    command: temporal
    args: [cloud, whoami]

dependencies:
  - name: temporal
    install: brew install temporal
    reason: powers all temporalctl tools
  - name: uvx
    install: brew install uv
    reason: runs the temporal MCP server

traits:
  temporal-query:
    description: "Temporal workflow inspection and monitoring"
    access: read
    namespaces: [temporal, temporalctl]
  temporal-infra:
    description: "Temporal infrastructure — dev server, namespaces, cloud, cluster operations"
    access: readwrite
    namespaces: [temporalctl]
